<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aethos — Encontre espaços esportivos, professores e academias perto de você no mapa.">
    <title>Aethos — Mapa de Espaços Esportivos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Popup personalizado dos locais esportivos */
        .popup-aethos .leaflet-popup-content-wrapper {
            background: rgba(13,15,50,0.95);
            border: 1px solid rgba(165,180,252,0.25);
            border-radius: 14px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            padding: 0;
            overflow: hidden;
        }
        .popup-aethos .leaflet-popup-content { margin: 0; width: 240px !important; }
        .popup-aethos .leaflet-popup-tip { background: rgba(13,15,50,0.95); }

        .popup-local { font-family: 'Inter', sans-serif; }
        .popup-foto { width: 100%; height: 110px; object-fit: cover; display: block; }
        .popup-nome { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.95rem; padding: 0.75rem 0.9rem 0.25rem; margin: 0; }
        .popup-modalidade { display: block; font-size: 0.75rem; color: rgba(165,180,252,0.8); padding: 0 0.9rem 0.4rem; }
        .popup-nota { padding: 0 0.9rem 0.4rem; font-size: 0.8rem; }
        .estrelas-popup { color: #FBBF24; }
        .nota-popup { font-weight: 600; color: #FBBF24; }
        .popup-professor { font-size: 0.78rem; color: rgba(255,255,255,0.5); padding: 0 0.9rem 0.5rem; margin: 0; }
        .btn-popup { display: block; text-align: center; margin: 0; padding: 0.7rem; background: rgba(165,180,252,0.15); color: #A5B4FC; font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: background 0.2s; border-top: 1px solid rgba(165,180,252,0.15); }
        .btn-popup:hover { background: rgba(165,180,252,0.25); color: #A5B4FC; }
        .marcador-local { display: flex; align-items: center; justify-content: center; }

        /* Botões superiores */
        #btn-barra-usuario {
            position: absolute; top: 0; right: 0; margin: 0.75rem;
            z-index: 1050; display: flex; gap: 0.5rem; align-items: center;
        }
        .btn-aethos-sair {
            background: rgba(13,15,50,0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(165,180,252,0.3); color: #A5B4FC;
            border-radius: 8px; padding: 0.45rem 1rem; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s; display: none;
        }
        .btn-aethos-sair:hover { background: rgba(165,180,252,0.12); }
        .btn-aethos-perfil {
            background: rgba(13,15,50,0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(165,180,252,0.3); color: #fff;
            border-radius: 8px; padding: 0.45rem 1rem; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s; text-decoration: none; display: none;
        }
        .btn-aethos-perfil:hover { background: rgba(165,180,252,0.12); color: #A5B4FC; }
    </style>
</head>
<body>

    <!-- Botões de Acesso / Conta -->
    <div id="btn-barra-usuario">
        <!-- Usuário NÃO logado -->
        <a href="login.html" id="btn-entrar" class="btn btn-light shadow fw-semibold">Entrar</a>
        <a href="login.html?tab=register" id="btn-cadastrar" class="btn btn-primary shadow fw-semibold">Cadastrar</a>

        <!-- Usuário LOGADO -->
        <a href="perfil.html" id="btn-perfil" class="btn-aethos-perfil"><i class="fa fa-user-circle"></i> <span id="nome-usuario-header"></span></a>
        <button id="btn-sair" class="btn-aethos-sair"><i class="fa fa-sign-out-alt"></i> Sair</button>
    </div>

    <!-- div superior ao mapa (busca) -->
    <div class="position-absolute top-0 start-50 translate-middle-x mt-3 z-3 d-flex justify-content-center w-100">
        <div style="max-width: 600px; width: 100%; position: relative;">
            <div class="input-group shadow-sm">
                <input type="text" id="searchInput" class="form-control" placeholder="Busque por um local ou endereço">
                <button class="btn btn-primary" id="searchBtn">Buscar</button>
            </div>
            <div id="caixaSugestoes" class="list-group position-absolute w-100 shadow" style="display: none; top: 100%; left: 0;"></div>
        </div>
    </div>

    <div class="w-100 h-100 z-0" id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/mapa.js"></script>
    <script src="js/mapa-locais.js"></script>

    <script>
        // ─── Verifica sessão e ajusta botões do header ──────────────────
        $.getJSON('backend/verificar_sessao.php', function(res) {
            if (res.autenticado) {
                $('#btn-entrar, #btn-cadastrar').hide();
                $('#nome-usuario-header').text(res.nome);
                $('#btn-perfil, #btn-sair').show().css('display', 'flex');

                // Botão sair
                $('#btn-sair').on('click', function() {
                    $.post('backend/logout.php', function() {
                        window.location.reload();
                    });
                });
            }
        }).fail(function() {
            // Sem sessão — mantém botões padrão de login/cadastro
        });
    </script>
</body>
</html>
