<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <!-- Botões de Acesso / Conta -->
    <div class="position-absolute top-0 end-0 m-3 d-flex gap-2" style="z-index: 1050;">
        <a href="login.html" class="btn btn-light shadow fw-semibold">Entrar</a>
        <a href="login.html?tab=register" class="btn btn-primary shadow fw-semibold">Cadastrar</a>
    </div>

    <!-- Seção de Divs -->


     <!-- div superior ao mapa -->

    <div class="position-absolute top-0 start-50 translate-middle-x mt-3 z-3 d-flex justify-content-center w-100">
        <div style="max-width: 600px; width: 100%; position: relative;">
            <!-- Seção de Sugestões e Autopreenchimento -->
            <div class="input-group shadow-sm">
                <input type="text" id="searchInput" class="form-control" placeholder="Busque por um local">
                <button class="btn btn-primary" id="searchBtn">Buscar</button>
            </div>
            
            <div id="caixaSugestoes" class="list-group position-absolute w-100 shadow" style="display: none; top: 100%; left: 0;">
            </div>

        </div>
    </div>

    <div class="w-100 h-100 z-0" id="map"></div>

    <!-- Seção de Links de Script -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/mapa.js"></script>

</body>
</html>
