<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aethos — Perfil do usuário, edição de dados e histórico de atividades.">
    <title>Meu Perfil — Aethos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --azul: #0D0F32; --lavanda: #A5B4FC; --branco: #FFFFFF; --glass: rgba(13,15,50,0.65); --border: rgba(165,180,252,0.2); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--azul); color: var(--branco); min-height: 100vh; }

        .header {
            background: rgba(13,15,50,0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); padding: 0 2rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--lavanda); text-decoration: none; }
        .btn-sair { background: transparent; border: 1px solid var(--border); color: var(--lavanda); border-radius: 8px; padding: 0.4rem 1rem; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .btn-sair:hover { background: rgba(165,180,252,0.1); }

        .container-perfil { max-width: 800px; margin: 2.5rem auto; padding: 0 1.5rem 4rem; }

        /* CARD DE PERFIL */
        .perfil-card {
            background: var(--glass); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 2.5rem; margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
        }
        .foto-wrapper { position: relative; cursor: pointer; }
        .foto-perfil { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--lavanda); background: rgba(165,180,252,0.1); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--lavanda); }
        .foto-overlay { position: absolute; inset: 0; border-radius: 50%; background: rgba(13,15,50,0.7); display: none; align-items: center; justify-content: center; color: var(--lavanda); font-size: 1.2rem; }
        .foto-wrapper:hover .foto-overlay { display: flex; }
        #input-foto { display: none; }

        .perfil-info { flex: 1; }
        .perfil-nome { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: 0.25rem; }
        .perfil-email { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 0.75rem; }
        .badge-tipo { display: inline-block; background: rgba(165,180,252,0.12); border: 1px solid var(--border); color: var(--lavanda); padding: 0.25rem 0.85rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        .perfil-acoes { display: flex; gap: 0.75rem; margin-top: 1rem; flex-wrap: wrap; }
        .btn-editar { background: rgba(165,180,252,0.12); border: 1px solid var(--border); color: var(--lavanda); border-radius: 10px; padding: 0.5rem 1.25rem; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
        .btn-editar:hover { background: rgba(165,180,252,0.2); }
        .btn-senha { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border-radius: 10px; padding: 0.5rem 1.25rem; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; }
        .btn-senha:hover { border-color: var(--border); color: var(--branco); }

        /* CARDS DE SEÇÃO */
        .section-card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; margin-bottom: 1.5rem; }
        .section-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 700; color: var(--lavanda); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }

        /* DADOS DO PERFIL */
        .dado-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0.75rem; }
        .dado-item { }
        .dado-label { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 0.2rem; }
        .dado-valor { font-size: 0.9rem; color: var(--branco); }

        /* LOCAIS DO PROFESSOR / AVALIAÇÕES DO ATLETA */
        .item-lista {
            border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem;
            margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
        }
        .item-nome { font-weight: 600; font-size: 0.9rem; }
        .item-sub  { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
        .badge-status { padding: 0.2rem 0.65rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .pendente  { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
        .aprovado  { background: rgba(34,197,94,0.1);  color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .desativado { background: rgba(239,68,68,0.1); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .estrelas-lista { color: #FBBF24; font-size: 0.85rem; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.aberto { display: flex; }
        .modal-box { background: #0f1136; border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 100%; max-width: 460px; margin: 1rem; }
        .modal-titulo { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; }
        .modal-fechar { float: right; background: none; border: none; color: rgba(255,255,255,0.5); font-size: 1.2rem; cursor: pointer; margin-top: -0.5rem; }

        .form-campo { margin-bottom: 1rem; }
        .form-campo label { display: block; font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 0.35rem; }
        .form-campo input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; padding: 0.65rem 0.9rem; color: var(--branco); font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        .form-campo input:focus { border-color: rgba(165,180,252,0.5); }
        .btn-modal-salvar { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, var(--lavanda), #818CF8); border: none; border-radius: 10px; color: var(--azul); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem; transition: all 0.3s; }
        .btn-modal-salvar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(165,180,252,0.3); }

        .status-msg { font-size: 0.85rem; margin-top: 0.75rem; padding: 0.6rem 0.9rem; border-radius: 8px; display: none; }
        .status-msg.ok  { background: rgba(34,197,94,0.1); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
        .status-msg.err { background: rgba(239,68,68,0.1);  color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

        .btn-add-local { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(165,180,252,0.1); border: 1px dashed var(--border); color: var(--lavanda); border-radius: 10px; padding: 0.65rem 1.25rem; font-size: 0.875rem; cursor: pointer; text-decoration: none; transition: all 0.2s; margin-top: 0.5rem; }
        .btn-add-local:hover { background: rgba(165,180,252,0.18); }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">⬡ Aethos</a>
    <button class="btn-sair" id="btn-sair"><i class="fa fa-sign-out-alt"></i> Sair</button>
</header>

<main class="container-perfil">

    <!-- CARD PRINCIPAL -->
    <div class="perfil-card" id="perfil-card">
        <div class="foto-wrapper" id="foto-wrapper" title="Alterar foto de perfil">
            <div class="foto-perfil" id="foto-display"><i class="fa fa-user"></i></div>
            <div class="foto-overlay"><i class="fa fa-camera"></i></div>
            <input type="file" id="input-foto" accept="image/jpeg,image/png,image/webp">
        </div>
        <div class="perfil-info">
            <div class="perfil-nome" id="p-nome">Carregando...</div>
            <div class="perfil-email" id="p-email"></div>
            <span class="badge-tipo" id="p-tipo"></span>
            <div class="perfil-acoes">
                <button class="btn-editar" id="btn-abrir-modal-editar"><i class="fa fa-pencil-alt"></i> Editar Perfil</button>
                <button class="btn-senha" id="btn-abrir-modal-senha"><i class="fa fa-lock"></i> Alterar Senha</button>
            </div>
        </div>
    </div>

    <!-- DADOS DO PERFIL -->
    <div class="section-card">
        <div class="section-title"><i class="fa fa-id-card"></i> Dados Cadastrais</div>
        <div class="dado-row">
            <div class="dado-item"><div class="dado-label">Apelido</div><div class="dado-valor" id="d-apelido">—</div></div>
            <div class="dado-item"><div class="dado-label">Telefone</div><div class="dado-valor" id="d-tel">—</div></div>
            <div class="dado-item"><div class="dado-label">CPF</div><div class="dado-valor" id="d-cpf">—</div></div>
            <div class="dado-item"><div class="dado-label">Membro desde</div><div class="dado-valor" id="d-desde">—</div></div>
        </div>
    </div>

    <!-- SEÇÃO PROFESSOR: Meus Locais -->
    <div class="section-card" id="section-professor" style="display:none;">
        <div class="section-title"><i class="fa fa-map-marker-alt"></i> Meus Locais Esportivos</div>
        <div id="lista-locais-professor"></div>
        <a href="professor/cadastrar-local.html" class="btn-add-local">
            <i class="fa fa-plus"></i> Cadastrar Novo Local
        </a>
    </div>

    <!-- SEÇÃO ATLETA: Minhas Avaliações -->
    <div class="section-card" id="section-atleta" style="display:none;">
        <div class="section-title"><i class="fa fa-star"></i> Minhas Avaliações</div>
        <div id="lista-avaliacoes-atleta"></div>
    </div>

</main>

<!-- MODAL: EDITAR PERFIL -->
<div class="modal-overlay" id="modal-editar">
    <div class="modal-box">
        <button class="modal-fechar" data-modal="modal-editar">✕</button>
        <div class="modal-titulo"><i class="fa fa-pencil-alt" style="color:var(--lavanda); margin-right:0.5rem;"></i>Editar Perfil</div>
        <div class="form-campo"><label>Nome Completo</label><input type="text" id="edit-nome" placeholder="Seu nome"></div>
        <div class="form-campo"><label>Apelido</label><input type="text" id="edit-apelido" placeholder="Apelido (opcional)"></div>
        <div style="display:grid; grid-template-columns:80px 1fr; gap:0.75rem;">
            <div class="form-campo"><label>DDD</label><input type="text" id="edit-ddd" placeholder="21" maxlength="3"></div>
            <div class="form-campo"><label>Telefone</label><input type="text" id="edit-tel" placeholder="99999-9999"></div>
        </div>
        <button class="btn-modal-salvar" id="btn-salvar-editar">Salvar Alterações</button>
        <div class="status-msg ok"  id="edit-ok"><i class="fa fa-check"></i> Perfil atualizado!</div>
        <div class="status-msg err" id="edit-err"></div>
    </div>
</div>

<!-- MODAL: ALTERAR SENHA -->
<div class="modal-overlay" id="modal-senha">
    <div class="modal-box">
        <button class="modal-fechar" data-modal="modal-senha">✕</button>
        <div class="modal-titulo"><i class="fa fa-lock" style="color:var(--lavanda); margin-right:0.5rem;"></i>Alterar Senha</div>
        <div class="form-campo"><label>Senha Atual</label><input type="password" id="senha-atual" placeholder="••••••••"></div>
        <div class="form-campo"><label>Nova Senha</label><input type="password" id="nova-senha" placeholder="Mínimo 5 caracteres"></div>
        <div class="form-campo"><label>Confirmar Nova Senha</label><input type="password" id="conf-senha" placeholder="Repita a nova senha"></div>
        <button class="btn-modal-salvar" id="btn-salvar-senha">Alterar Senha</button>
        <div class="status-msg ok"  id="senha-ok"><i class="fa fa-check"></i> Senha alterada com sucesso!</div>
        <div class="status-msg err" id="senha-err"></div>
    </div>
</div>

<script src="js/jquery.min.js"></script>
<script>
$(document).ready(function() {

    var USUARIO = null;
    var tipoMap = { 'comum': 'Atleta', 'professor': 'Professor', 'admin': 'Administrador', 'desenvolvedor': 'Desenvolvedor' };

    // ─── SESSÃO ────────────────────────────────────────────────
    $.getJSON('backend/verificar_sessao.php', function(res) {
        if (!res.autenticado) { window.location.href = 'login.html'; return; }
        USUARIO = res;
        carregarPerfil();
    }).fail(function() { window.location.href = 'login.html'; });

    // ─── CARREGA DADOS DO PERFIL ──────────────────────────────
    function carregarPerfil() {
        $.getJSON('backend/perfil.php?acao=obter', function(resp) {
            if (!resp.sucesso) { alert('Falha ao carregar perfil.'); return; }
            var u = resp.data;

            // Exibe foto ou ícone
            if (u.foto_perfil) {
                $('#foto-display').html('<img src="' + u.foto_perfil + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">');
            }

            $('#p-nome').text(u.nome);
            $('#p-email').text(u.email);
            $('#p-tipo').text(tipoMap[u.tipo_usuario] || u.tipo_usuario);
            $('#d-apelido').text(u.apelido || '—');
            $('#d-tel').text(u.ddd && u.telefone ? '(' + u.ddd + ') ' + u.telefone : '—');
            $('#d-cpf').text(u.cpf || '—');
            $('#d-desde').text(new Date(u.criado_em).toLocaleDateString('pt-BR'));

            // Preenche modais
            $('#edit-nome').val(u.nome);
            $('#edit-apelido').val(u.apelido || '');
            $('#edit-ddd').val(u.ddd || '');
            $('#edit-tel').val(u.telefone || '');

            // Seções específicas por perfil
            if (u.tipo_usuario === 'professor') {
                $('#section-professor').show();
                carregarLocaisProfessor();
            } else if (u.tipo_usuario === 'comum') {
                $('#section-atleta').show();
                carregarAvaliacoesAtleta();
            }
        }).fail(function() {
            alert('Erro ao carregar perfil. Tente novamente.');
        });
    }

    // ─── LOCAIS DO PROFESSOR ──────────────────────────────────
    function carregarLocaisProfessor() {
        $.getJSON('backend/perfil.php?acao=meus_locais', function(resp) {
            if (!resp.sucesso || !resp.data.length) {
                $('#lista-locais-professor').html('<p style="color:rgba(255,255,255,0.4); font-size:0.875rem;">Nenhum local cadastrado ainda.</p>');
                return;
            }
            var html = resp.data.map(function(l) {
                var statusClass = l.aprovado ? 'aprovado' : (l.ativo ? 'pendente' : 'desativado');
                var statusTxt   = l.aprovado ? 'Aprovado' : (l.ativo ? 'Pendente' : 'Desativado');
                return '<div class="item-lista">' +
                    '<div><div class="item-nome">' + h(l.nome) + '</div><div class="item-sub">' + h(l.modalidade) + ' — ' + (l.cidade || '—') + '</div></div>' +
                    '<span class="badge-status ' + statusClass + '">' + statusTxt + '</span>' +
                    '</div>';
            }).join('');
            $('#lista-locais-professor').html(html);
        });
    }

    // ─── AVALIAÇÕES DO ATLETA ─────────────────────────────────
    function carregarAvaliacoesAtleta() {
        $.getJSON('backend/perfil.php?acao=minhas_avaliacoes', function(resp) {
            if (!resp.sucesso || !resp.data.length) {
                $('#lista-avaliacoes-atleta').html('<p style="color:rgba(255,255,255,0.4); font-size:0.875rem;">Você ainda não avaliou nenhum local.</p>');
                return;
            }
            var html = resp.data.map(function(av) {
                var stars = ''; for (var i = 1; i <= 5; i++) stars += i <= av.nota ? '★' : '☆';
                return '<div class="item-lista">' +
                    '<div>' +
                        '<div class="item-nome">' + h(av.local_nome) + '</div>' +
                        '<div class="item-sub">' + h(av.modalidade) + ' — ' + new Date(av.criado_em).toLocaleDateString('pt-BR') + '</div>' +
                    '</div>' +
                    '<div class="estrelas-lista">' + stars + '</div>' +
                    '</div>';
            }).join('');
            $('#lista-avaliacoes-atleta').html(html);
        });
    }

    // ─── UPLOAD DE FOTO ───────────────────────────────────────
    $('#foto-wrapper').on('click', function() { $('#input-foto').trigger('click'); });
    $('#input-foto').on('change', function() {
        var file = this.files[0];
        if (!file) return;
        var fd = new FormData();
        fd.append('foto', file);
        fd.append('tipo', 'perfil');
        $.ajax({
            url: 'backend/upload.php', method: 'POST',
            data: fd, processData: false, contentType: false,
            success: function(resp) {
                if (resp.sucesso) {
                    $('#foto-display').html('<img src="' + resp.caminho + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">');
                    // Atualiza foto no banco
                    $.ajax({
                        url: 'backend/perfil.php?acao=atualizar_foto',
                        method: 'POST', contentType: 'application/json',
                        data: JSON.stringify({ foto_perfil: resp.caminho }),
                        success: function(r) { if (!r.sucesso) alert(r.mensagem); }
                    });
                } else {
                    alert(resp.mensagem);
                }
            },
            error: function() { alert('Erro ao enviar foto.'); }
        });
    });

    // ─── MODAIS ───────────────────────────────────────────────
    $('#btn-abrir-modal-editar').on('click', function() { $('#modal-editar').addClass('aberto'); });
    $('#btn-abrir-modal-senha').on('click', function() { $('#modal-senha').addClass('aberto'); });
    $('.modal-fechar').on('click', function() { $('#' + $(this).data('modal')).removeClass('aberto'); });
    $(document).on('keydown', function(e) { if (e.key === 'Escape') $('.modal-overlay').removeClass('aberto'); });
    $('.modal-overlay').on('click', function(e) { if ($(e.target).hasClass('modal-overlay')) $(this).removeClass('aberto'); });

    // ─── SALVAR EDIÇÃO DE PERFIL ──────────────────────────────
    $('#btn-salvar-editar').on('click', function() {
        var $btn = $(this).prop('disabled', true);
        $('#edit-ok, #edit-err').hide();
        $.ajax({
            url: 'backend/perfil.php?acao=editar',
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({
                nome:    $('#edit-nome').val().trim(),
                apelido: $('#edit-apelido').val().trim(),
                ddd:     $('#edit-ddd').val().trim(),
                telefone: $('#edit-tel').val().trim()
            }),
            success: function(resp) {
                if (resp.sucesso) {
                    $('#edit-ok').show();
                    $('#p-nome').text($('#edit-nome').val().trim());
                    setTimeout(function() { $('#modal-editar').removeClass('aberto'); }, 1200);
                } else {
                    $('#edit-err').text(resp.mensagem).show();
                }
            },
            error: function() { $('#edit-err').text('Erro de comunicação.').show(); },
            complete: function() { $btn.prop('disabled', false); }
        });
    });

    // ─── ALTERAR SENHA ────────────────────────────────────────
    $('#btn-salvar-senha').on('click', function() {
        var $btn = $(this).prop('disabled', true);
        $('#senha-ok, #senha-err').hide();
        var nova = $('#nova-senha').val();
        if (nova !== $('#conf-senha').val()) {
            $('#senha-err').text('As senhas não coincidem.').show();
            $btn.prop('disabled', false);
            return;
        }
        if (nova.length < 5) {
            $('#senha-err').text('A senha deve ter no mínimo 5 caracteres.').show();
            $btn.prop('disabled', false);
            return;
        }
        $.ajax({
            url: 'backend/trocar_senha.php',
            method: 'POST', contentType: 'application/json',
            data: JSON.stringify({ senha_atual: $('#senha-atual').val(), nova_senha: nova }),
            success: function(resp) {
                if (resp.sucesso) {
                    $('#senha-ok').show();
                    $('#senha-atual, #nova-senha, #conf-senha').val('');
                    setTimeout(function() { $('#modal-senha').removeClass('aberto'); }, 1500);
                } else {
                    $('#senha-err').text(resp.mensagem).show();
                }
            },
            error: function() { $('#senha-err').text('Erro de comunicação.').show(); },
            complete: function() { $btn.prop('disabled', false); }
        });
    });

    // ─── LOGOUT ───────────────────────────────────────────────
    $('#btn-sair').on('click', function() {
        $.post('backend/logout.php', function() { window.location.href = 'login.html'; });
    });

    function h(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
});
</script>
</body>
</html>
