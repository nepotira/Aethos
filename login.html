<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethos - Acesso</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones (olho de senha, google) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        .hidden-tab { display: none; }
        .active-tab-btn { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        /* Suavizar transições do tailwind */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden flex flex-col">
        
        <!-- HEADER ABAS PRINCIPAIS (Login / Cadastro) -->
        <div class="flex border-b text-center text-gray-500">
            <button id="btn-tab-login" class="w-1/2 py-4 active-tab-btn uppercase text-sm" onclick="switchMainTab('login')">Entrar</button>
            <button id="btn-tab-register" class="w-1/2 py-4 uppercase text-sm hover:text-blue-500 transition" onclick="switchMainTab('register')">Cadastrar</button>
        </div>

        <div class="p-6 fade-in">
            
            <!-- ====== SESSÃO DE ESCOLHA DE PERFIL (Comum para os dois) ====== -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Quem é você?</label>
                <div class="flex flex-wrap gap-2" id="profile-selector">
                    <!-- Botões de Perfil -->
                    <button class="perfil-btn active bg-blue-500 text-white px-3 py-1.5 rounded text-sm shadow-sm transition" data-type="comum">Atleta / Usuário</button>
                    <button class="perfil-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-1.5 rounded text-sm transition" data-type="professor">Professor / Local</button>
                    
                    <!-- Admins e Devs só aparecem no Login -->
                    <button class="perfil-btn login-only bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-1.5 rounded text-sm transition" data-type="admin">Admin</button>
                    <button class="perfil-btn login-only bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-1.5 rounded text-sm transition" data-type="desenvolvedor">Desenvolvedor</button>
                </div>
            </div>

            <!-- ====== FORMULÁRIO DE LOGIN ====== -->
            <form id="form-login" class="space-y-4">
                <input type="hidden" name="tipo_usuario" value="comum">
                
                <div id="login-identifier-wrapper">
                    <label class="block text-sm font-medium text-gray-700 mb-1" id="label-login-email">E-mail</label>
                    <input type="email" id="login-email" name="email" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="seu@email.com" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="login-senha" name="senha" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Sua senha" required>
                        <i class="fa fa-eye-slash absolute right-3 top-3 text-gray-400 cursor-pointer toggle-password" data-target="login-senha"></i>
                    </div>
                </div>

                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center text-gray-600 cursor-pointer">
                        <input type="checkbox" class="mr-2 rounded text-blue-500"> Lembrar-me
                    </label>
                    <a href="#" class="text-blue-500 hover:underline">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg shadow-md hover:bg-blue-700 transition">
                    Entrar
                </button>

                <!-- Área de botões sociais (Aparece só p/ usuários normais) -->
                <div class="social-login-wrapper mt-4">
                    <div class="relative flex items-center justify-center my-4">
                        <div class="border-t border-gray-300 w-full"></div>
                        <span class="bg-white px-3 text-xs text-gray-500 absolute">OU</span>
                    </div>
                    <button type="button" class="w-full border text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-50 transition flex justify-center items-center gap-2">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" class="w-4 h-4">
                        Entrar com Google
                    </button>
                </div>
            </form>


            <!-- ====== FORMULÁRIO DE CADASTRO ====== -->
            <form id="form-register" class="space-y-4 hidden-tab">
                <input type="hidden" name="tipo_usuario" value="comum">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" name="nome" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Apelido (Opcional)</label>
                    <input type="text" name="apelido" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                    <input type="email" name="email" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>

                <div class="flex gap-2">
                    <div class="w-1/4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">DDD</label>
                        <input type="text" name="ddd" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="11" maxlength="2" required>
                    </div>
                    <div class="w-3/4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
                        <input type="text" name="telefone" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="90000-0000" required>
                    </div>
                </div>

                <!-- CARGA ESPECÍFICA DO PROFESSOR (Escondida por padrão) -->
                <div id="campos-professor" class="hidden space-y-4 border-l-4 border-yellow-400 pl-3 bg-yellow-50 py-2 rounded-r-lg">
                    <label class="block text-xs font-semibold text-yellow-700 uppercase">Informações do Local/Professor</label>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">CPF</label>
                        <input type="text" name="cpf" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500 outline-none" placeholder="000.000.000-00">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Endereço Fixo</label>
                        <input type="text" name="endereco" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500 outline-none" placeholder="Rua do Dojo, 123">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Criar Senha</label>
                    <div class="relative">
                        <input type="password" id="reg-senha" name="senha" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <i class="fa fa-eye-slash absolute right-3 top-3 text-gray-400 cursor-pointer toggle-password" data-target="reg-senha"></i>
                    </div>
                </div>

                <!-- Botão centralizado de Cadastro -->
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg shadow-md hover:bg-blue-700 transition mt-2">
                    Criar conta
                </button>
            </form>

            <div id="mensagem-alerta" class="mt-4 text-center text-sm hidden p-2 rounded"></div>

        </div>
    </div>

    <!-- Script de Lógica Principal -->
    <script src="js/auth.js"></script>
</body>
</html>
