<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethos - Troca Obrigatória de Senha</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="js/jquery.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            DEFAULT: '#0D0F32',
                            dark: '#080a22',
                        },
                        lavender: {
                            light: '#E0E7FF',
                            DEFAULT: '#A5B4FC',
                            dark: '#818CF8',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes appleBlurReveal {
            0% { opacity: 0; filter: blur(20px); transform: scale(0.98); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }
        .card { animation: appleBlurReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-navy-dark min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden font-sans">
    
    <!-- Ambient glowing backgrounds -->
    <div class="absolute top-[-20%] right-[-20%] w-[600px] h-[600px] rounded-full bg-indigo-500/10 blur-[150px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] left-[-20%] w-[600px] h-[600px] rounded-full bg-purple-500/10 blur-[150px] pointer-events-none"></div>

    <!-- Back navigation arrow -->
    <a href="login.html" style="position:fixed; top:1.5rem; left:1.5rem; width:44px; height:44px; border-radius:50%; background:rgba(13,15,50,0.6); border:1px solid rgba(165,180,252,0.2); backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:center; color:#A5B4FC; text-decoration:none; font-size:1.1rem; transition:all 0.25s; z-index:20; box-shadow:0 4px 15px rgba(0,0,0,0.3);" title="Voltar">
        <i class="fa fa-arrow-left"></i>
    </a>

    <div class="card bg-navy/70 border border-lavender/20 backdrop-blur-xl rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5),0_0_30px_rgba(165,180,252,0.05)] w-full max-w-md overflow-hidden p-6 z-10">
        
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-white font-display">Definição de Segurança</h2>
            <p class="text-xs text-gray-400 mt-2">Como profissional/desenvolvedor em seu primeiro acesso, é obrigatório trocar a senha padrão por uma senha forte e pessoal para continuar.</p>
        </div>

        <form id="form-troca-senha" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-lavender/80 mb-1 font-display">Crie sua Nova Senha</label>
                <div class="relative">
                    <input type="password" id="nova-senha" name="senha" class="w-full border-lavender/20 bg-navy-dark/50 text-white rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-lavender-dark focus:border-lavender-dark outline-none border transition-all duration-200 placeholder-gray-600" placeholder="Digite uma senha forte" required>
                    <i class="fa fa-eye-slash absolute right-3.5 top-3.5 text-lavender/50 hover:text-white transition-colors cursor-pointer toggle-senha" data-target="nova-senha"></i>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-lavender/80 mb-1 font-display">Confirme a Nova Senha</label>
                <div class="relative">
                    <input type="password" id="confirma-senha" class="w-full border-lavender/20 bg-navy-dark/50 text-white rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-lavender-dark focus:border-lavender-dark outline-none border transition-all duration-200 placeholder-gray-600" placeholder="Repita a senha" required>
                    <i class="fa fa-eye-slash absolute right-3.5 top-3.5 text-lavender/50 hover:text-white transition-colors cursor-pointer toggle-senha" data-target="confirma-senha"></i>
                </div>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-lavender-dark text-navy font-bold py-2.5 rounded-lg shadow-lg shadow-indigo-500/20 hover:scale-[1.01] hover:shadow-indigo-500/35 transition-all duration-300 mt-4">
                Salvar Senha e Entrar
            </button>
        </form>

        <div id="mensagem" class="mt-4 text-center text-sm hidden p-3 rounded-lg font-medium transition-all duration-200"></div>
    </div>

    <script>
        $(document).ready(window.onload = function() {

            // PATCH BUG-09: Verifica se há sessão PHP ativa ao carregar a página
            // Redireciona imediatamente para login.html se não autenticado
            $.ajax({
                url: 'backend/verificar_sessao.php',
                type: 'GET',
                dataType: 'json',
                success: function(res) {
                    if (!res.autenticado) {
                        window.location.href = 'login.html';
                    }
                },
                error: function() {
                    // Erro de rede: por segurança, redireciona para login
                    window.location.href = 'login.html';
                }
            });

            // Mostrar/Esconder senha
            $('.toggle-senha').on('click', function() {
                const input = $('#' + $(this).data('target'));
                if (input.attr('type') === 'password') {
                    input.attr('type', 'text');
                    $(this).removeClass('fa-eye-slash').addClass('fa-eye text-lavender');
                } else {
                    input.attr('type', 'password');
                    $(this).removeClass('fa-eye text-lavender').addClass('fa-eye-slash');
                }
            });

            // Envio
            $('#form-troca-senha').on('submit', function(e) {
                e.preventDefault();
                
                const s1 = $('#nova-senha').val();
                const s2 = $('#confirma-senha').val();
                const msgBox = $('#mensagem');

                if (s1 !== s2) {
                    msgBox.removeClass('hidden bg-green-900/30 text-green-300 border border-green-500/20').addClass('bg-red-900/30 text-red-300 border border-red-500/20').text('As senhas não coincidem!').fadeIn();
                    return;
                }

                if (s1.length < 5) {
                    msgBox.removeClass('hidden bg-green-900/30 text-green-300 border border-green-500/20').addClass('bg-red-900/30 text-red-300 border border-red-500/20').text('A senha deve ter no mínimo 5 caracteres').fadeIn();
                    return;
                }

                const btn = $(this).find('button');
                btn.text('Atualizando...').prop('disabled', true);

                $.ajax({
                    url: 'backend/trocar_senha.php',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ nova_senha: s1 }),
                    success: function(res) {
                        if(res.sucesso) {
                            msgBox.removeClass('hidden bg-red-900/30 text-red-300 border border-red-500/20').addClass('bg-green-900/30 text-green-300 border border-green-500/20').text(res.mensagem).fadeIn();
                            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                        } else {
                            // PATCH BUG-10: Detecta sessão expirada e redireciona para login
                            if (res.mensagem && res.mensagem.toLowerCase().includes('acesso negado')) {
                                alert('Sua sessão expirou. Faça login novamente.');
                                window.location.href = 'login.html';
                                return;
                            }
                            msgBox.removeClass('hidden bg-green-900/30 text-green-300 border border-green-500/20').addClass('bg-red-900/30 text-red-300 border border-red-500/20').text(res.mensagem || 'Erro desconhecido.').fadeIn();
                            btn.text('Salvar Senha e Entrar').prop('disabled', false);
                        }
                    },
                    error: function() {
                        msgBox.removeClass('hidden bg-green-900/30 text-green-300 border border-green-500/20').addClass('bg-red-900/30 text-red-300 border border-red-500/20').text('Erro de servidor.').fadeIn();
                        btn.text('Salvar Senha e Entrar').prop('disabled', false);
                    }
                });
            });
        });
    </script>
</body>
</html>
