<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethos - Troca Obrigatória de Senha</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden p-6 border-t-8 border-yellow-400">
        
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">Definição de Segurança</h2>
            <p class="text-sm text-gray-500 mt-2">Como profissional/desenvolvedor em seu primeiro acesso, é obrigatório trocar a senha padrão por uma senha forte e pessoal para continuar.</p>
        </div>

        <form id="form-troca-senha" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Crie sua Nova Senha</label>
                <div class="relative">
                    <input type="password" id="nova-senha" name="senha" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500 outline-none" placeholder="Digite uma senha forte" required>
                    <i class="fa fa-eye-slash absolute right-3 top-3 text-gray-400 cursor-pointer toggle-senha" data-target="nova-senha"></i>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirme a Nova Senha</label>
                <div class="relative">
                    <input type="password" id="confirma-senha" class="w-full border-gray-300 border rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500 outline-none" placeholder="Repita a senha" required>
                    <i class="fa fa-eye-slash absolute right-3 top-3 text-gray-400 cursor-pointer toggle-senha" data-target="confirma-senha"></i>
                </div>
            </div>

            <button type="submit" class="w-full bg-yellow-500 text-white font-bold py-2.5 rounded-lg shadow hover:bg-yellow-600 transition mt-4">
                Salvar Senha e Entrar
            </button>
        </form>

        <div id="mensagem" class="mt-4 text-center text-sm hidden p-2 rounded"></div>
    </div>

    <script>
        $(document).ready(function() {

            // PATCH BUG-09: Verifica se há sessão PHP ativa ao carregar a página
            // Redireciona imediatamente para login.html se não autenticado
            $.ajax({
                url: 'backend/verificar_sessao.php',
                type: 'GET',
                dataType: 'json',
                success: function(res) {
                    if (!res.autenticado) {
                        window.location.href = 'login.html';
                    }
                },
                error: function() {
                    // Erro de rede: por segurança, redireciona para login
                    window.location.href = 'login.html';
                }
            });

            // Mostrar/Esconder senha
            $('.toggle-senha').on('click', function() {
                const input = $('#' + $(this).data('target'));
                if (input.attr('type') === 'password') {
                    input.attr('type', 'text');
                    $(this).removeClass('fa-eye-slash').addClass('fa-eye text-yellow-500');
                } else {
                    input.attr('type', 'password');
                    $(this).removeClass('fa-eye text-yellow-500').addClass('fa-eye-slash');
                }
            });

            // Envio
            $('#form-troca-senha').on('submit', function(e) {
                e.preventDefault();
                
                const s1 = $('#nova-senha').val();
                const s2 = $('#confirma-senha').val();
                const msgBox = $('#mensagem');

                if (s1 !== s2) {
                    msgBox.removeClass('hidden bg-green-100 text-green-700').addClass('bg-red-100 text-red-700').text('As senhas não coincidem!').fadeIn();
                    return;
                }

                if (s1.length < 5) {
                    msgBox.removeClass('hidden bg-green-100 text-green-700').addClass('bg-red-100 text-red-700').text('A senha deve ter no mínimo 5 caracteres').fadeIn();
                    return;
                }

                const btn = $(this).find('button');
                btn.text('Atualizando...').prop('disabled', true);

                $.ajax({
                    url: 'backend/trocar_senha.php',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ nova_senha: s1 }),
                    success: function(res) {
                        if(res.sucesso) {
                            msgBox.removeClass('hidden bg-red-100 text-red-700').addClass('bg-green-100 text-green-700').text(res.mensagem).fadeIn();
                            setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                        } else {
                            // PATCH BUG-10: Detecta sessão expirada e redireciona para login
                            if (res.mensagem && res.mensagem.toLowerCase().includes('acesso negado')) {
                                alert('Sua sessão expirou. Faça login novamente.');
                                window.location.href = 'login.html';
                                return;
                            }
                            msgBox.removeClass('hidden bg-green-100 text-green-700').addClass('bg-red-100 text-red-700').text(res.mensagem || 'Erro desconhecido.').fadeIn();
                            btn.text('Salvar Senha e Entrar').prop('disabled', false);
                        }
                    },
                    error: function() {
                        msgBox.removeClass('hidden bg-green-100 text-green-700').addClass('bg-red-100 text-red-700').text('Erro de servidor.').fadeIn();
                        btn.text('Salvar Senha e Entrar').prop('disabled', false);
                    }
                });
            });
        });
    </script>
</body>
</html>
