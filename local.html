<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aethos — Detalhes do local esportivo, avaliações e contato.">
    <title>Local Esportivo — Aethos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Bootstrap + FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --azul-marinho: #0D0F32;
            --lavanda:      #A5B4FC;
            --branco:       #FFFFFF;
            --glass-bg:     rgba(13,15,50,0.65);
            --glass-border: rgba(165,180,252,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--azul-marinho);
            color: var(--branco);
            min-height: 100vh;
        }

        /* ─── HEADER ─────────────────────────────── */
        .header {
            background: rgba(13,15,50,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 200;
        }

        .logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--lavanda);
            text-decoration: none;
        }

        .btn-sair {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--lavanda);
            border-radius: 8px;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sair:hover { background: rgba(165,180,252,0.1); }
        #btn-sair-wrap { display: none; }

        /* ─── FOTO CAPA ──────────────────────────── */
        .foto-capa {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
        }

        .foto-placeholder {
            width: 100%;
            height: 320px;
            background: linear-gradient(135deg, #1a1d4e, #0D0F32);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: rgba(165,180,252,0.2);
        }

        /* ─── CONTAINER PRINCIPAL ────────────────── */
        .page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* ─── CARD GLASS ─────────────────────────── */
        .card-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.75rem;
            margin-bottom: 1.5rem;
        }

        /* ─── HEADER DO LOCAL ────────────────────── */
        .local-nome {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .badge-modalidade {
            display: inline-block;
            background: rgba(165,180,252,0.15);
            border: 1px solid var(--glass-border);
            color: var(--lavanda);
            padding: 0.3rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* ─── NOTA MÉDIA ─────────────────────────── */
        .nota-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .estrelas-grandes {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #FBBF24;
        }

        .nota-numero {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .nota-total {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }

        /* ─── INFO GRID ──────────────────────────── */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .info-icon {
            color: var(--lavanda);
            font-size: 1rem;
            margin-top: 2px;
            min-width: 18px;
        }

        .info-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 0.2rem;
        }

        .info-value {
            font-size: 0.9rem;
            color: var(--branco);
        }

        .info-value a {
            color: var(--lavanda);
            text-decoration: none;
        }
        .info-value a:hover { text-decoration: underline; }

        /* ─── PROFESSOR ──────────────────────────── */
        .professor-row {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .prof-foto {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--glass-border);
        }

        .prof-foto-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(165,180,252,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--lavanda);
            font-size: 1.2rem;
            border: 2px solid var(--glass-border);
        }

        .prof-nome {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .prof-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
        }

        /* ─── MAPA MINI ──────────────────────────── */
        #mapa-mini {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            z-index: 1;
        }

        /* ─── AVALIAÇÕES ─────────────────────────── */
        .section-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--branco);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .avaliacao-item {
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 0;
        }
        .avaliacao-item:last-child { border-bottom: none; }

        .av-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .av-nome { font-weight: 600; font-size: 0.9rem; }
        .av-data { font-size: 0.75rem; color: rgba(255,255,255,0.4); }
        .av-estrelas { color: #FBBF24; font-size: 0.9rem; }
        .av-comentario { font-size: 0.875rem; color: rgba(255,255,255,0.7); margin-top: 0.35rem; }

        .sem-avaliacoes {
            text-align: center;
            color: rgba(255,255,255,0.3);
            padding: 2rem;
            font-size: 0.9rem;
        }

        /* ─── FORMULÁRIO DE AVALIAÇÃO ────────────── */
        .form-avaliar textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: var(--branco);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 80px;
            outline: none;
            margin-top: 1rem;
            transition: border-color 0.2s;
        }

        .form-avaliar textarea:focus { border-color: rgba(165,180,252,0.5); }

        .btn-avaliar {
            margin-top: 1rem;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, var(--lavanda), #818CF8);
            border: none;
            border-radius: 10px;
            color: var(--azul-marinho);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-avaliar:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(165,180,252,0.3); }
        .btn-avaliar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .login-para-avaliar {
            text-align: center;
            padding: 1.5rem;
            background: rgba(165,180,252,0.05);
            border: 1px dashed var(--glass-border);
            border-radius: 10px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
        }

        .login-para-avaliar a {
            color: var(--lavanda);
            font-weight: 600;
            text-decoration: none;
        }

        /* ─── STATUS BOX ─────────────────────────── */
        .status-box {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            margin-top: 0.75rem;
            display: none;
        }
        .status-box.sucesso { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
        .status-box.erro    { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }

        /* ─── LOADING ────────────────────────────── */
        .page-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 1rem;
            color: rgba(255,255,255,0.4);
        }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(165,180,252,0.2);
            border-top-color: var(--lavanda);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
    <a href="index.html" class="logo">⬡ Aethos</a>
    <div id="btn-sair-wrap">
        <button class="btn-sair" id="btn-sair"><i class="fa fa-sign-out-alt"></i> Sair</button>
    </div>
</header>

<!-- CONTEÚDO DINÂMICO -->
<div id="page-loading" class="page-loading">
    <div class="spinner"></div>
    <span>Carregando local...</span>
</div>

<div id="page-content" style="display:none;">
    <!-- Foto de capa -->
    <div id="capa-container"></div>

    <div class="page-container">

        <!-- CARD: Informações principais -->
        <div class="card-glass">
            <span class="badge-modalidade" id="local-modalidade"></span>
            <h1 class="local-nome" id="local-nome"></h1>

            <div class="nota-row">
                <div class="estrelas-grandes" id="local-estrelas"></div>
                <span class="nota-numero" id="local-nota"></span>
                <span class="nota-total" id="local-total-av"></span>
            </div>

            <p id="local-descricao" style="color:rgba(255,255,255,0.7); line-height:1.7; margin-bottom:1.5rem;"></p>

            <div class="info-grid" id="local-info"></div>
        </div>

        <!-- CARD: Professor -->
        <div class="card-glass" id="card-professor">
            <div class="section-title"><i class="fa fa-user-tie" style="color:var(--lavanda)"></i> Responsável pelo Espaço</div>
            <div class="professor-row">
                <div id="prof-foto-container"></div>
                <div>
                    <div class="prof-label">Professor / Responsável</div>
                    <div class="prof-nome" id="prof-nome"></div>
                </div>
            </div>
        </div>

        <!-- CARD: Mapa mini -->
        <div class="card-glass" id="card-mapa" style="display:none;">
            <div class="section-title"><i class="fa fa-map" style="color:var(--lavanda)"></i> Localização</div>
            <div id="mapa-mini"></div>
        </div>

        <!-- CARD: Avaliações -->
        <div class="card-glass">
            <div class="section-title">
                <i class="fa fa-star" style="color:#FBBF24"></i>
                Avaliações <span id="badge-total" style="font-size:0.8rem; color:rgba(255,255,255,0.4); font-weight:400;"></span>
            </div>

            <!-- Lista de avaliações -->
            <div id="lista-avaliacoes"></div>

            <!-- Formulário ou login -->
            <div id="area-avaliar" style="margin-top:1.5rem; border-top:1px solid var(--glass-border); padding-top:1.5rem;"></div>
        </div>

    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/avaliacao.js"></script>

<script>
$(document).ready(function() {

    var localId    = null;
    var sessaoAtual = null;
    var mapaInicializado = false;

    // ─── LÊ ?id=X DA URL ──────────────────────────────────────
    var params = new URLSearchParams(window.location.search);
    localId = parseInt(params.get('id'), 10);

    if (!localId || isNaN(localId)) {
        window.location.href = 'index.html';
        return;
    }

    // ─── VERIFICA SESSÃO (opcional, apenas para mostrar botão sair + form avaliação)
    $.getJSON('backend/verificar_sessao.php', function(res) {
        sessaoAtual = res;
        if (res.autenticado) {
            $('#btn-sair-wrap').show();
            $('#btn-sair').on('click', function() {
                $.post('backend/logout.php', function() {
                    window.location.href = 'login.html';
                });
            });
        }
        carregarLocal();
    }).fail(function() {
        sessaoAtual = { autenticado: false };
        carregarLocal();
    });

    // ─── CARREGA DADOS DO LOCAL ────────────────────────────────
    function carregarLocal() {
        $.ajax({
            url:      'backend/locais.php?acao=detalhe&id=' + localId,
            method:   'GET',
            dataType: 'json',
            success: function(resp) {
                if (!resp.sucesso) {
                    alert('Local não encontrado.');
                    window.location.href = 'index.html';
                    return;
                }
                renderizarLocal(resp.data);
                $('#page-loading').hide();
                $('#page-content').show();
            },
            error: function() {
                alert('Falha ao carregar o local. Tente novamente.');
                window.location.href = 'index.html';
            }
        });
    }

    // ─── RENDERIZA LOCAL NA PÁGINA ─────────────────────────────
    function renderizarLocal(l) {
        document.title = l.nome + ' — Aethos';

        // Foto de capa
        if (l.foto_capa) {
            $('#capa-container').html('<img src="' + l.foto_capa + '" alt="' + l.nome + '" class="foto-capa">');
        } else {
            $('#capa-container').html('<div class="foto-placeholder"><i class="fa fa-dumbbell"></i></div>');
        }

        // Cabeçalho
        $('#local-modalidade').text(l.modalidade);
        $('#local-nome').text(l.nome);

        // Nota
        var nota = parseFloat(l.nota_media) || 0;
        $('#local-estrelas').html(renderEstrelas(nota));
        $('#local-nota').text(nota.toFixed(1));
        $('#local-total-av').text('(' + l.total_avaliacoes + ' avaliações)');
        $('#badge-total').text('(' + l.total_avaliacoes + ')');

        // Descrição
        if (l.descricao) {
            $('#local-descricao').text(l.descricao);
        } else {
            $('#local-descricao').hide();
        }

        // Grid de infos
        var infos = [];
        if (l.endereco) infos.push({ icon: 'fa-map-marker-alt', label: 'Endereço', value: l.endereco + (l.cidade ? ', ' + l.cidade + '/' + l.estado : '') });
        if (l.telefone_contato) infos.push({ icon: 'fa-phone', label: 'Contato', value: '<a href="tel:' + l.telefone_contato + '">' + l.telefone_contato + '</a>' });
        if (l.instagram) infos.push({ icon: 'fa-instagram', label: 'Instagram', value: '<a href="https://instagram.com/' + l.instagram.replace('@','') + '" target="_blank">' + l.instagram + '</a>' });
        if (l.horarios) infos.push({ icon: 'fa-clock', label: 'Horários', value: l.horarios });

        var infoHtml = infos.map(function(i) {
            return '<div class="info-item"><div class="info-icon"><i class="fa ' + i.icon + '"></i></div>' +
                   '<div><div class="info-label">' + i.label + '</div><div class="info-value">' + i.value + '</div></div></div>';
        }).join('');
        $('#local-info').html(infoHtml);

        // Professor
        var profFoto = l.professor_foto
            ? '<img src="' + l.professor_foto + '" alt="Professor" class="prof-foto">'
            : '<div class="prof-foto-placeholder"><i class="fa fa-user"></i></div>';
        $('#prof-foto-container').html(profFoto);
        $('#prof-nome').text(l.professor_nome);

        // Mapa mini
        if (l.latitude && l.longitude) {
            $('#card-mapa').show();
            if (!mapaInicializado) {
                mapaInicializado = true;
                setTimeout(function() {
                    var miniMapa = L.map('mapa-mini').setView([l.latitude, l.longitude], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(miniMapa);
                    L.marker([l.latitude, l.longitude])
                        .bindPopup('<strong>' + l.nome + '</strong><br>' + l.endereco)
                        .addTo(miniMapa)
                        .openPopup();
                }, 100);
            }
        }

        // Lista de avaliações
        renderizarAvaliacoes(l.avaliacoes);

        // Área de avaliação
        renderizarAreaAvaliar(l);
    }

    // ─── RENDER ESTRELAS ──────────────────────────────────────
    function renderEstrelas(nota) {
        var html = '';
        for (var i = 1; i <= 5; i++) {
            html += i <= Math.round(nota) ? '★' : '☆';
        }
        return html;
    }

    // ─── RENDER AVALIAÇÕES ─────────────────────────────────────
    function renderizarAvaliacoes(avaliacoes) {
        if (!avaliacoes || avaliacoes.length === 0) {
            $('#lista-avaliacoes').html('<div class="sem-avaliacoes"><i class="fa fa-star" style="font-size:2rem; margin-bottom:0.5rem; display:block;"></i>Ainda não há avaliações. Seja o primeiro!</div>');
            return;
        }

        var html = avaliacoes.map(function(av) {
            var estrelas = '';
            for (var i = 1; i <= 5; i++) estrelas += i <= av.nota ? '★' : '☆';
            var data = new Date(av.criado_em).toLocaleDateString('pt-BR');
            return '<div class="avaliacao-item">' +
                '<div class="av-header">' +
                    '<div>' +
                        '<div class="av-estrelas">' + estrelas + '</div>' +
                        '<div class="av-nome">' + av.avaliador_nome + '</div>' +
                    '</div>' +
                    '<div class="av-data">' + data + '</div>' +
                '</div>' +
                (av.comentario ? '<div class="av-comentario">' + av.comentario + '</div>' : '') +
                '</div>';
        }).join('');

        $('#lista-avaliacoes').html(html);
    }

    // ─── ÁREA DE AVALIAÇÃO (form ou login) ────────────────────
    function renderizarAreaAvaliar(local) {
        if (!sessaoAtual || !sessaoAtual.autenticado) {
            $('#area-avaliar').html(
                '<div class="login-para-avaliar">' +
                '<i class="fa fa-star" style="color:#FBBF24; margin-right:0.5rem;"></i>' +
                '<a href="login.html?redirect=local.html?id=' + localId + '">Faça login</a>' +
                ' para avaliar este local.' +
                '</div>'
            );
            return;
        }

        if (sessaoAtual.tipo_usuario !== 'comum') {
            $('#area-avaliar').html('<p style="color:rgba(255,255,255,0.4); font-size:0.875rem;">Apenas Atletas podem avaliar locais.</p>');
            return;
        }

        // Verifica se já avaliou
        var jaAvaliou = local.avaliacoes && local.avaliacoes.some(function(av) {
            return av.avaliador_nome === sessaoAtual.nome;
        });

        if (jaAvaliou) {
            $('#area-avaliar').html(
                '<p style="color:rgba(165,180,252,0.8); font-size:0.875rem;">' +
                '<i class="fa fa-check-circle"></i> Você já avaliou este local. ' +
                '<span id="btn-editar-av" style="cursor:pointer; text-decoration:underline; color:var(--lavanda);">Editar avaliação</span>' +
                '</p>'
            );
            $('#btn-editar-av').on('click', function() { renderizarFormAvaliacao(true); });
        } else {
            renderizarFormAvaliacao(false);
        }
    }

    // ─── FORMULÁRIO DE AVALIAÇÃO ──────────────────────────────
    function renderizarFormAvaliacao(isEdicao) {
        var titulo = isEdicao ? 'Editar sua avaliação' : 'Avaliar este local';
        var html =
            '<p style="font-weight:600; margin-bottom:0.75rem;">' + titulo + '</p>' +
            '<div id="stars-container" class="form-avaliar"></div>' +
            '<textarea id="comentario-av" placeholder="Deixe um comentário (opcional)..."></textarea>' +
            '<button type="button" class="btn-avaliar" id="btn-enviar-av">' +
                '<i class="fa fa-paper-plane"></i> ' + (isEdicao ? 'Atualizar' : 'Enviar Avaliação') +
            '</button>' +
            '<div class="status-box sucesso" id="av-sucesso"><i class="fa fa-check"></i> Avaliação enviada! Obrigado.</div>' +
            '<div class="status-box erro" id="av-erro"><i class="fa fa-times"></i> <span id="av-erro-txt"></span></div>';

        $('#area-avaliar').html(html);

        // Inicializa o componente de estrelas (de avaliacao.js)
        if (typeof AethosAvaliacaoStars === 'function') {
            AethosAvaliacaoStars('#stars-container');
        }

        $('#btn-enviar-av').on('click', function() {
            var nota = parseInt($('#stars-container').data('nota'), 10);
            if (!nota || nota < 1 || nota > 5) {
                $('#av-erro-txt').text('Selecione uma nota de 1 a 5 estrelas.');
                $('#av-erro').show();
                return;
            }

            var payload = {
                local_id:   localId,
                nota:       nota,
                comentario: $('#comentario-av').val().trim()
            };

            $(this).prop('disabled', true);
            $('#av-sucesso, #av-erro').hide();

            var acao = isEdicao ? 'editar' : 'criar';

            $.ajax({
                url:         'backend/avaliacoes.php?acao=' + acao,
                method:      'POST',
                contentType: 'application/json',
                data:        JSON.stringify(payload),
                success: function(resp) {
                    if (resp.sucesso) {
                        $('#av-sucesso').show();
                        $('#btn-enviar-av').hide();
                        // Recarrega a lista de avaliações
                        setTimeout(function() { carregarLocal(); }, 1500);
                    } else {
                        $('#av-erro-txt').text(resp.mensagem || 'Erro ao enviar.');
                        $('#av-erro').show();
                        $('#btn-enviar-av').prop('disabled', false);
                    }
                },
                error: function() {
                    $('#av-erro-txt').text('Falha na comunicação. Tente novamente.');
                    $('#av-erro').show();
                    $('#btn-enviar-av').prop('disabled', false);
                }
            });
        });
    }

});
</script>

</body>
</html>
